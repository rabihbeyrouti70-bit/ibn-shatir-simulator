<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow512" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="65%" stop-color="#0B1329"/>
      <stop offset="100%" stop-color="#040711"/>
    </radialGradient>
    <linearGradient id="goldGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="35%" stop-color="#FBBF24"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="blueGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FEF08A"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="rgba(245, 158, 11, 0)"/>
    </radialGradient>
    <filter id="glow512" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded rectangle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow512)"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="url(#goldGrad512)" stroke-width="5" opacity="0.85"/>
  <rect width="480" height="480" x="16" y="16" rx="96" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.5"/>

  <!-- Outer Celestial Meridian / Zodiac Sphere -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#334155" stroke-width="2.5" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="url(#goldGrad512)" stroke-width="3.5" opacity="0.75"/>
  <circle cx="256" cy="256" r="132" fill="none" stroke="url(#blueGrad512)" stroke-width="2.5" stroke-dasharray="8 4"/>
  <circle cx="256" cy="256" r="92" fill="none" stroke="#F43F5E" stroke-width="2" opacity="0.6"/>

  <!-- Ibn al-Shatir Double Epicycle System -->
  <circle cx="316" cy="208" r="42" fill="none" stroke="#34D399" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="340" cy="186" r="16" fill="none" stroke="#A78BFA" stroke-width="1.8"/>
  <circle cx="350" cy="178" r="7" fill="#38BDF8" filter="url(#glow512)"/>

  <!-- Astrolabe Orthogonal Grids / Great Circles -->
  <line x1="256" y1="44" x2="256" y2="468" stroke="#475569" stroke-width="1.8" stroke-dasharray="4 6"/>
  <line x1="44" y1="256" x2="468" y2="256" stroke="#475569" stroke-width="1.8" stroke-dasharray="4 6"/>

  <!-- 8-Pointed Islamic Geometric Medallion -->
  <g transform="translate(256,256) rotate(22.5)" stroke="url(#goldGrad512)" stroke-width="3" fill="none" opacity="0.9">
    <rect x="-48" y="-48" width="96" height="96" rx="3"/>
    <rect x="-48" y="-48" width="96" height="96" rx="3" transform="rotate(45)"/>
  </g>

  <!-- Central Radiant Sun / Pivot -->
  <circle cx="256" cy="256" r="38" fill="url(#sunGlow)"/>
  <circle cx="256" cy="256" r="22" fill="url(#goldGrad512)" filter="url(#glow512)"/>
  <circle cx="256" cy="256" r="10" fill="#FFFBEB"/>

  <!-- Moon Crescent (Hilal) -->
  <path d="M 160 160 A 34 34 0 1 0 192 116 A 26 26 0 1 1 160 160 Z" fill="url(#goldGrad512)" filter="url(#glow512)" opacity="0.95"/>
</svg>
