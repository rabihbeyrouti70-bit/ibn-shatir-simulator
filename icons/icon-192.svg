<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#060913"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="192" height="192" rx="42" fill="url(#bgGlow)"/>
  <rect width="186" height="186" x="3" y="3" rx="39" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.8"/>

  <!-- Celestial Horizon & Coordinate Rings -->
  <circle cx="96" cy="96" r="74" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="96" cy="96" r="62" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" opacity="0.65"/>
  <circle cx="96" cy="96" r="46" fill="none" stroke="url(#blueGrad)" stroke-width="1.5" stroke-dasharray="4 2"/>
  <circle cx="96" cy="96" r="30" fill="none" stroke="#F43F5E" stroke-width="1.2" opacity="0.7"/>

  <!-- Tusi Couple / Epicycle Ring -->
  <circle cx="114" cy="80" r="14" fill="none" stroke="#34D399" stroke-width="1.2" stroke-dasharray="2 2"/>
  <circle cx="122" cy="74" r="3.5" fill="#34D399"/>

  <!-- Astrolabe Throne (al-Kursi) / Axis Indicators -->
  <line x1="96" y1="16" x2="96" y2="176" stroke="#475569" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="16" y1="96" x2="176" y2="96" stroke="#475569" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- 8-Pointed Star Center (Islamic Geometric Motif) -->
  <g transform="translate(96,96) rotate(22.5)" stroke="url(#goldGrad)" stroke-width="1.5" fill="none" opacity="0.9">
    <rect x="-16" y="-16" width="32" height="32" rx="1"/>
    <rect x="-16" y="-16" width="32" height="32" rx="1" transform="rotate(45)"/>
  </g>

  <!-- Central Radiant Sun -->
  <circle cx="96" cy="96" r="9" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="96" cy="96" r="5" fill="#FFFBEB"/>

  <!-- Crescent Moon Symbol in Orbit -->
  <path d="M 62 60 A 13 13 0 1 0 74 44 A 10 10 0 1 1 62 60 Z" fill="url(#goldGrad)" opacity="0.95"/>
</svg>
